name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dernière version stable (3.14) + les 3 précédentes, à l'image du
        # SDK JS qui couvre plusieurs versions de Node dans son "engines".
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      # Uniquement les tests unitaires ici : ce workflow n'a pas de secret
      # SANGHO_API_KEY et ne doit pas dépendre de la disponibilité du
      # sandbox externe. Les tests d'intégration se lancent à part, en
      # local, via `make test-integration`.
      - name: Tests + couverture
        run: make test-ci
