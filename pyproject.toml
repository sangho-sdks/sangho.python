[build-system]
requires = ["setuptools>=61", "wheel", "hatchling"]
build-backend = "hatchling.build"

[project]
name = "sangho"
version = "0.2.0"
description = "SDK officiel Python pour l'API Sangho"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sangho", email = "nels.holy.allg@gmail.com" }]
keywords = ["sangho", "payments", "afrique", "xaf", "mobile-money", "sdk", "python"]
dependencies = ["httpx>=0.27.0"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://docs.sangho.ga/api/sdks/python/"
Repository = "https://github.com/sangho-sdks/sangho.python"
Issues = "https://github.com/sangho-sdks/sangho.python/issues"
Changelog = "https://github.com/sangho-sdks/sangho.python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "sangho/__init__.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sangho*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Le formateur gère le code ; E501 ne resterait que sur des docstrings et commentaires en français.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# Le client HTTP (sangho/_http.py, sangho/_http_async.py) retourne des
# valeurs Any par nature (httpx.Response.json() est non typé), et chaque
# méthode de ressource (sangho/resources/*.py, resources_async/*.py) les
# renvoie telles quelles sous une annotation `-> dict` simplifiée. Ce
# pattern est utilisé partout dans le SDK et n'a jamais satisfait ces
# trois règles de `strict` — les désactiver ici reflète l'état réel du
# code plutôt que de bloquer le CI sur ~690 erreurs préexistantes. Le
# reste de `strict` (None-checks, égalité stricte, etc.) reste actif.
# TODO : annoter proprement (dict[str, Any] partout + retours du client
# HTTP castés) pour pouvoir retirer ces trois overrides.
disallow_any_generics = false
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests d'intégration nécessitant SANGHO_API_KEY (sandbox)",
]
